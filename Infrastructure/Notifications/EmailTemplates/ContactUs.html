<div style="max-width:600px;margin:auto;background:#ffffff;
            border-radius:8px;padding:24px;
            box-shadow:0 2px 8px rgba(0,0,0,.08)">

    <h2 style="color:#333;margin-top:0;">
        Neue Kontaktanfrage 📩
    </h2>

    <p style="color:#555;font-size:14px;line-height:1.7;">
        Eine neue Anfrage wurde über das Kontaktformular der Website gesendet.
    </p>

    <table style="width:100%;font-size:14px;color:#333;border-collapse:collapse;margin-top:20px;">
        <tr>
            <td style="padding:8px 0;font-weight:bold;width:140px;">Name:</td>
            <td style="padding:8px 0;">{{FullName}}</td>
        </tr>
        <tr>
            <td style="padding:8px 0;font-weight:bold;">E-Mail:</td>
            <td style="padding:8px 0;">{{Email}}</td>
        </tr>
        <tr>
            <td style="padding:8px 0;font-weight:bold;">Telefon:</td>
            <td style="padding:8px 0;">{{Phone}}</td>
        </tr>
    </table>

    <hr style="border:none;border-top:1px solid #eee;margin:24px 0;" />

    <p style="font-size:14px;color:#333;font-weight:bold;">
        Nachricht:
    </p>

    <div style="background:#f7f9fb;
                border-radius:6px;
                padding:16px;
                font-size:14px;
                color:#555;
                line-height:1.7;">
        {{Message}}
    </div>

</div>
